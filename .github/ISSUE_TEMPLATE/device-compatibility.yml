name: Device compatibility report
description: Report a successful or unsuccessful battery reading for a peripheral.
title: "[Compatibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Battery Monitor! Reports are public. Do not include personal information, email addresses, account names, serial numbers, MAC addresses, device instance IDs, credentials or private keys.
        You may answer in English, Ukrainian or Russian. A report without diagnostic files is welcome.
  - type: input
    id: model
    attributes:
      label: Manufacturer and exact device model
      placeholder: e.g. AJAZZ AJ179 APEX
    validations:
      required: true
  - type: dropdown
    id: device_type
    attributes:
      label: Device type
      options:
        - Mouse
        - Keyboard
        - Headset
        - Game controller
        - Other
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection used during the test
      options:
        - 2.4 GHz USB receiver or dock
        - Bluetooth
        - USB cable
        - Other or unknown
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: Battery Monitor version
      placeholder: "0.12.0"
    validations:
      required: true
  - type: input
    id: windows_version
    attributes:
      label: Windows version / build (optional)
      placeholder: "Windows 11 24H2"
  - type: dropdown
    id: result
    attributes:
      label: Test result
      options:
        - Battery percentage displayed and verified
        - Percentage displayed but accuracy not verified
        - Device detected but percentage unavailable
        - Incorrect or stale percentage
        - Device not detected
        - Application error
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Observed result and expected result
      description: Describe the test and, if available, compare with the manufacturer's app or Windows battery display. Do not guess the percentage.
      placeholder: "Battery Monitor: ... / reference reading: ... / does the value update: ..."
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional redacted diagnostics
      description: Use Save diagnostics in Battery Monitor only if helpful. Review the contents and remove personal information, identifiers and secrets before pasting. Do not upload an unreviewed file.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report
      options:
        - label: I understand that this report is public and have removed personal information and secrets.
          required: true
